[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcare"
version = "1.0.0"
description = "AgentCare - AI-powered healthcare administration and care coordination using CrewAI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

keywords = [
    "crewai",
    "fastapi",
    "streamlit",
    "healthcare",
    "ai",
    "agents",
    "hospital",
    "automation"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "crewai>=0.193.0",
    "crewai-tools>=0.60.0",
    "litellm>=1.74.0",
    "openai>=1.99.0",
    "mistralai>=1.9.0",

    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    "sqlalchemy>=2.0.40",
    "alembic>=1.16.0",

    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",

    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.3.0,<5.0.0",
    "python-multipart>=0.0.20",

    "streamlit>=1.47.0",

    "requests>=2.32.0",
    "httpx>=0.28.0",

    "email-validator>=2.2.0",
    "python-dotenv>=1.1.0",
    "aiofiles>=24.1.0",

    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "black>=25.0.0",
    "isort>=6.0.0",
    "flake8>=7.0.0",
    "mypy>=1.15.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/agentcare"
Repository = "https://github.com/yourusername/agentcare"
Documentation = "https://github.com/yourusername/agentcare/wiki"
Issues = "https://github.com/yourusername/agentcare/issues"

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
